# GitHub Pages runs Jekyll only so this exclude list is applied.
# The site is the static index.html, the offline kiosk file, the educator sheet, the narration clips and the
# versioned service worker. Sources, notes, tests and the test build stay out of it.
exclude:
  - README.md
  # voice/<lang>/*.mp3 stays published: the web page loads its narration clips from there (I15).
  - voice/en/manifest.json
  - vendor
  - docs
  - tests
  - index.test.html
  - node_modules
  - model.mjs
  - strings.mjs
  - game.js
  - scene.js
  - style.css
  - build.mjs
  - voice-lines.mjs
  - voice.mjs
  - make-voice.ps1
  - make-voice.cmd
  - sw.js
